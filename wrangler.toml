name = "planetlocksmiths"
compatibility_date = "2024-05-01"

## When deploying to Cloudflare Pages, the build output from Next.js will be
## written to the `.vercel/output/static` directory. Specifying this
## directory tells Cloudflare Pages where to find the static assets and
## functions generated by the build. You can leave this file unchanged
## unless you move or rename the output directory in the future.
pages_build_output_dir = ".vercel/output/static"