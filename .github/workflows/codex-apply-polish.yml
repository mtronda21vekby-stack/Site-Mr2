name: Codex apply polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-polish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Codex patch
        shell: bash
        run: |
          set -euo pipefail
          ls -l .codex/codex-polish.patch.gz.b64.part-*
          cat .codex/codex-polish.patch.gz.b64.part-* > /tmp/codex-polish.patch.gz.b64
          base64 -d /tmp/codex-polish.patch.gz.b64 | gzip -d > /tmp/codex-polish.patch
          git apply --binary --whitespace=nowarn /tmp/codex-polish.patch
          rm -rf .codex .github/workflows/codex-apply-polish.yml
          git config user.name "codex-app"
          git config user.email "codex-app@users.noreply.github.com"
          git add -A
          git commit -m "Polish locksmith content and settings fallbacks"
          git push
