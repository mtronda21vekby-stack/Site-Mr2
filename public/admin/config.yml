backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Settings"
    files:
      - file: "src/content/settings/global.json"
        label: "Global Settings"
        name: "global_settings"
        fields:
          - { label: "Brand Name", name: "brandName", widget: "string" }
          - { label: "Primary Phone", name: "phonePrimary", widget: "string" }
          - { label: "Display Phone", name: "phoneDisplay", widget: "string" }
          - { label: "Service Hours", name: "serviceHours", widget: "string" }
  - name: "home_en"
    label: "Home EN"
    files:
      - file: "src/content/home/en.json"
        label: "Home English"
        name: "home_en"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - { label: "Primary CTA", name: "heroPrimaryCta", widget: "string" }
          - { label: "Secondary CTA", name: "heroSecondaryCta", widget: "string" }
