<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Planetlocksmiths logo</title>
  <desc id="desc">Premium blue planet locksmith logo with orbit, shield, and lock.</desc>
  <defs>
