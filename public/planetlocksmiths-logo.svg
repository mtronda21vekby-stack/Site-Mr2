      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.28" stop-color="#DCEBFF"/>
      <stop offset="0.58" stop-color="#2F69B3"/>
      <stop offset="1" stop-color="#0B1F4D"/>
    </radialGradient>
    <linearGradient id="orbitStroke" x1="23" y1="77" x2="231" y2="181" gradientUnits="userSpaceOnUse">
